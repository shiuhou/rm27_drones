[pytest]
# ROS pytest plugins leak into this venv via system site-packages and fail
# to import (missing yaml). They are irrelevant here; disable them.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_xmllint -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint
testpaths = tests
